# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Frontend to Azure Web App - govbridge

on:
  push:
    branches:
      - Frontend
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Frontend

      - name: Build frontend
        run: npm run build
        working-directory: Frontend

      - name: Stage frontend Node app
        run: |
          mkdir -p deploy/dist
          cp server.js package.json package-lock.json deploy/
          cp -R dist/. deploy/dist/
          npm ci --omit=dev --prefix deploy
        working-directory: Frontend

      - name: Upload frontend Node app artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-node-app
          path: Frontend/deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: frontend-node-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6D2A93D7EF544DC0A3ACC4061C5EC5E2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8A50142FAAB74C62ACF8738F9713F9F5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CAED8A7D636944F59F18E8AA5F31FE20 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'govbridge'
          slot-name: 'Production'
          package: deploy/
          startup-command: 'npm start'
          